<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="disconnected"><span>You have been disconnected. <a href=".">Refresh</a> to try to rejoin.</span></div>
    <video class="video">Video stream not available.</video>
    <img class="foreground" src="">
    <a class="qr-link"><div class="qr"></div></a>
    <footer class="footer">
        <select class="foreground-select">
            <option value="">No Foreground</option>
        </select>
        <div class="countdown-container"><span class="countdown"></span></div>
        <input type="button" class="capture" value="Take Picture 📷">
        <input type="button" class="clear" value="Clear🗑️">
    </footer>
    <canvas class="canvas"></canvas>

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.js"></script>
    <script src="index.js"></script>
</body>
</html>
