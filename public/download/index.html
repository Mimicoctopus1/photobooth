<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="disconnected"><span>You have been disconnected. <a href=".">Refresh</a> to try to rejoin.</span></div>
    <h1>Click a photo to download!</h1>
    <div><a href=".">Refresh</a> to update and get new photos.</div>
    <h1 class="loading-sign"><span>Loading...</span></h1>

    <canvas class="download-prepper"></canvas>
    <a class="downloader"></a>
    <div class="photos">
        
    </div>
    <script src="index.js"></script>
</body>
</html>
